<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Avant | AI Marketing for Remodelers</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Manrope', sans-serif;
        background-color: #fafaf9; /* Warm Stone-50 */
        color: #0c0a09; /* Stone-950 */
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      
      .font-serif-italic {
        font-family: 'Playfair Display', serif;
        font-style: italic;
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #d6d3d1;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #a8a29e;
      }
      
      .glass-panel {
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
      }
      
      .text-balance {
        text-wrap: balance;
      }

      /* Marquee Animation */
      .animate-marquee {
        animation: marquee 25s linear infinite;
      }
      @keyframes marquee {
        0% { transform: translateX(0); }
        100% { transform: translateX(-50%); }
      }

      /* Float Animation */
      .animate-float-slow {
        animation: float 6s ease-in-out infinite;
      }
      .animate-float-medium {
        animation: float 5s ease-in-out infinite;
        animation-delay: 1s;
      }
      .animate-float-fast {
        animation: float 4s ease-in-out infinite;
        animation-delay: 2s;
      }
      @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-20px); }
        100% { transform: translateY(0px); }
      }
    </style>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Manrope', 'sans-serif'],
              serif: ['Playfair Display', 'serif'],
            },
            colors: {
              brand: {
                dark: '#022c22', // Deepest Emerald/Black
                primary: '#10b981', // Emerald 500
                secondary: '#0f766e', // Teal 700
                accent: '#34d399', // Emerald 400
                surface: '#ffffff',
              },
              stone: {
                50: '#fafaf9',
                100: '#f5f5f4',
                200: '#e7e5e4',
                800: '#292524',
                900: '#1c1917',
                950: '#0c0a09',
              }
            },
            borderRadius: {
              '3xl': '1.75rem',
              '4xl': '2.5rem',
              '5xl': '3.5rem',
            },
            boxShadow: {
              'soft': '0 2px 15px -3px rgba(0, 0, 0, 0.04), 0 10px 40px -10px rgba(0, 0, 0, 0.02)',
              'glow': '0 0 40px rgba(16, 185, 129, 0.2)',
              'card': '0 0 0 1px rgba(0,0,0,0.02), 0 4px 12px rgba(0,0,0,0.04)',
              'pop': '8px 8px 0px 0px rgba(28, 25, 23, 1)',
            },
            backgroundImage: {
              'emerald-gradient': 'linear-gradient(135deg, #059669 0%, #115e59 100%)', 
              'surface-gradient': 'linear-gradient(to bottom right, #ffffff, #fafaf9)',
            }
          }
        }
      }
    </script>

    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.556.0"
  }
}
</script>
</head>

    <div id="root"></div>

  </body>
</html>
